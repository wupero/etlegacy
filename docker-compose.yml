# etl-speedrun-server — ET:Legacy speedrun dedicated server (all client platforms)
#
# Build:  docker compose up -d --build   (from THIS directory, misc/docker/)
#
#   Before building, GITHUB_TOKEN must be in the environment (export
#   GITHUB_TOKEN=... or a .env next to this file) — the build clones the PRIVATE
#   wupero repos. It is a build-arg, visible in `docker history`: use a
#   repo-scoped token with Contents: Read on wupero/etlegacy and
#   wupero/etl-speedrun-configs.
#
#   The image builds etlded + qagame (server) natively and takes ALL client
#   modules (mac/win/linux) + timeruns/mapscripts from the etl-speedrun-configs
#   repo (modules/, luascripts/, mapscripts/), so no cross-compiling happens in
#   the image. Keep that repo's modules/ in sync when the cgame/ui source here
#   changes (rebuild + commit them).
#
# Run:    docker compose up -d
services:
  server:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # GITHUB_TOKEN is build-time-only (cloning the private repos); it is NOT
        # needed at runtime. All runtime settings live in `environment` below.
        GITHUB_TOKEN: ${GITHUB_TOKEN:-}
        # REF: ${REF:-master}
        # CONFIG_REF: ${CONFIG_REF:-master}
    image: etl-speedrun-server:latest
    container_name: etl-speedrun-server
    environment:
      # Server hostname (+set sv_hostname).
      - HOSTNAME=${HOSTNAME:-etlspeedrun.cc}
      # rcon password (+set rconPassword).
      - RCON_PASSWORD=${RCON_PASSWORD:-}
      # Backend API key used by the server's HTTP calls (+set g_apiKey).
      - API_KEY=${API_KEY:-}
      # Speedrun API endpoint, reached over the shared network as `api:8090`
      # (the etl-speedrun-api container). Override if the api is elsewhere.
      - G_API_URL=${G_API_URL:-http://api:8090/api}
      # Game UDP port. Change to match a host port mapping if desired.
      - PORT=27960
      # For fast pk3 downloads over HTTP, set a base URL and a www port, e.g.
      #   SV_WWW_BASE_URL=http://<host>:8080
      # and serve /legacy/server over HTTP on that port.
      # - SV_WWW_BASE_URL=${SV_WWW_BASE_URL:-}
    ports:
      - "27960:27960/udp"
      # - "8080:8080"   # only if using SV_WWW_BASE_URL
    volumes:
      # Persist logs/configs written to the homepath across restarts.
      - etl-speedrun-homepath:/legacy/homepath
      # Host map pk3s, bind-mounted read-only into the container at /legacy/maps.
      # The entrypoint symlinks each *.pk3 into /legacy/server/etmain/ at startup
      # (a direct mount onto etmain/ would hide the baked-in base paks). Point
      # MAPS_DIR at the host dir holding the map pk3s, e.g. ~/httpfiles/maps.
      - ${MAPS_DIR:-~/httpfiles/maps}:/legacy/maps:ro
    # Reach the speedrun API (etl-speedrun-api) on the shared network by the
    # service name `api` at :8090 (same pattern as etl-speedrun-web).
    networks:
      - default
      - shared
    restart: unless-stopped

volumes:
  etl-speedrun-homepath:
    name: etl-speedrun-homepath

networks:
  # Shared with the etl-speedrun-api + etl-speedrun-web stacks so this server
  # reaches the backend by service name `api`. Create it once:
  #   docker network create etl-speedrun-net
  shared:
    external: true
    name: etl-speedrun-net
